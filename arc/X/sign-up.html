<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up — Cloudra</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f6f6f7; --surface: #ffffff; --border: #e2e2e5;
      --text: #1b1b1f; --text-2: #6b6b78; --text-3: #9b9ba8;
      --orange: #f38020; --orange-dim: rgba(243,128,32,0.1); --orange-hover: #e06b10;
      --red: #e53e3e; --red-dim: rgba(229,62,62,0.08);
      --green: #00b894; --green-dim: rgba(0,184,148,0.1);
      --discord: #5865F2; --discord-hover: #4752c4; --discord-dim: rgba(88,101,242,0.1);
      --nav-bg: #1b1b1f; --mono: 'IBM Plex Mono', monospace; --sans: 'IBM Plex Sans', sans-serif; --radius: 6px;
    }
    body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    nav { background: var(--nav-bg); height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; }
    .nav-brand { display: flex; align-items: center; gap: 10px; }
    .nav-brand img { width: 26px; height: 26px; object-fit: contain; }
    .nav-brand span { font-size: 0.95rem; font-weight: 600; color: #fff; }
    .nav-link { font-size: 0.78rem; color: #a0a0ae; text-decoration: none; transition: color 0.15s; }
    .nav-link:hover { color: #fff; }
    .auth-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .auth-box { width: 100%; max-width: 420px; }
    .auth-header { margin-bottom: 28px; }
    .auth-title { font-size: 1.5rem; font-weight: 600; margin-bottom: 6px; }
    .auth-sub { font-size: 0.83rem; color: var(--text-2); }
    .auth-sub a { color: var(--orange); text-decoration: none; }
    .auth-sub a:hover { text-decoration: underline; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; }
    .alert { padding: 11px 14px; border-radius: var(--radius); font-size: 0.78rem; margin-bottom: 18px; font-family: var(--mono); display: none; }
    .alert.error { background: var(--red-dim); border: 1px solid rgba(229,62,62,0.2); color: var(--red); }
    .alert.success { background: var(--green-dim); border: 1px solid rgba(0,184,148,0.2); color: var(--green); }
    .alert.show { display: block; animation: fadeUp 0.2s ease; }
    .btn-discord {
      width: 100%; padding: 13px; border: none; border-radius: var(--radius);
      background: var(--discord); color: #fff; font-family: var(--sans); font-size: 0.92rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s, box-shadow 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-discord:hover { background: var(--discord-hover); box-shadow: 0 2px 16px rgba(88,101,242,0.35); }
    .btn-discord:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }
    .btn-discord svg { width: 22px; height: 22px; flex-shrink: 0; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .notice {
      margin-top: 18px; padding: 10px 14px; background: #f0f0f3; border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 0.74rem; color: var(--text-2); line-height: 1.5;
    }
    .notice strong { color: var(--text); font-weight: 500; }
    .divider { display: flex; align-items: center; gap: 14px; margin: 22px 0 0; }
    .divider-line { flex: 1; height: 1px; background: var(--border); }
    .divider-text { font-size: 0.72rem; color: var(--text-3); }
    .login-cta { text-align: center; margin-top: 14px; font-size: 0.82rem; color: var(--text-2); }
    .login-cta a { color: var(--orange); text-decoration: none; font-weight: 500; }
    .login-cta a:hover { text-decoration: underline; }
    .footer { text-align: center; font-size: 0.72rem; color: var(--text-3); padding: 24px; }
  </style>
</head>
<body>
<nav>
  <div class="nav-brand">
    <img src="img/icon.png" alt="Logo" onerror="this.style.display='none'"/>
    <span>Cloudra</span>
  </div>
  <a href="login.html" class="nav-link">Already have an account? Sign in →</a>
</nav>
<div class="auth-wrapper">
  <div class="auth-box">
    <div class="auth-header">
      <div class="auth-title">Create your account</div>
      <div class="auth-sub">Already have one? <a href="login.html">Sign in</a></div>
    </div>
    <div class="card">
      <div class="alert" id="alert"></div>
      <button class="btn-discord" id="btn" onclick="doDiscordSignup()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
        Continue with Discord
      </button>
      <div class="notice"><strong>One account per IP.</strong> We enforce this to keep the free VPS fair for everyone. Your Discord email must be verified.</div>
      <div class="divider"><div class="divider-line"></div><div class="divider-text">have an account?</div><div class="divider-line"></div></div>
      <div class="login-cta"><a href="login.html">Sign in instead →</a></div>
    </div>
  </div>
</div>
<div class="footer">© 2025 Cloudra · All rights reserved</div>
<script>
  const DISCORD_SIGNUP_URL = "https://discord.com/oauth2/authorize?client_id=1506619418678136862&response_type=code&redirect_uri=https%3A%2F%2Fcloudra.vortexa.cloud%2Fsign-up&scope=identify+email";

  function showAlert(msg, type) {
    const el = document.getElementById('alert');
    el.textContent = msg;
    el.className = 'alert ' + type + ' show';
  }

  async function fetchAvatarBase64(userId, avatarHash) {
    try {
      const url = `https://cdn.discordapp.com/avatars/${userId}/${avatarHash}.png?size=128`;
      const res = await fetch(url);
      const blob = await res.blob();
      return await new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(blob);
      });
    } catch { return null; }
  }

  async function doDiscordSignup() {
    // If we have a code in the URL, process it
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');

    if (!code) {
      // Redirect to Discord OAuth
      window.location.href = DISCORD_SIGNUP_URL;
      return;
    }

    const btn = document.getElementById('btn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> Creating account...';

    try {
      const res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code })
      });
      const data = await res.json();

      if (data.status === 'success') {
        localStorage.setItem('username', data.username);
        localStorage.setItem('password', data.pass);

        // Fetch and store Discord avatar as base64
        if (data.discordId && data.avatar) {
          const b64 = await fetchAvatarBase64(data.discordId, data.avatar);
          if (b64) localStorage.setItem('img', b64);
        }

        showAlert('Account created! Redirecting...', 'success');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
      } else {
        showAlert(data.message || 'Signup failed.', 'error');
        btn.disabled = false;
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" style="width:22px;height:22px"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg> Continue with Discord`;
      }
    } catch (e) {
      showAlert('Connection error. Please try again.', 'error');
      btn.disabled = false;
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" style="width:22px;height:22px"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg> Continue with Discord`;
    }
  }

  // Auto-trigger if code is present in URL
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    if (params.get('code')) doDiscordSignup();
  });
</script>
</body>
</html>
